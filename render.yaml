# Деплой на Render (бесплатный тариф): New → Blueprint → выбрать этот репозиторий.
# Бесплатный сервис засыпает через 15 минут без посетителей и просыпается ~за минуту.
# Диск временный: база (data/lumen.db) и загруженные картинки обнуляются при перезапуске.
services:
  - type: web
    name: lumen
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DEV_AUTH
        value: "0"
      - key: APP_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false # вставить вручную в панели Render — в репозиторий не попадает
      - key: ADMIN_IDS
        sync: false # ваш Telegram ID (узнать у @userinfobot) — доступ к ленте без подписки
      - key: ANTHROPIC_API_KEY
        sync: false # необязательно: без ключа отклики пишутся по шаблону
      - key: PRICE_RUB
        value: "270"
      - key: PRICE_STARS
        value: "180"
